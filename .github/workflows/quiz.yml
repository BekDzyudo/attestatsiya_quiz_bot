name: Attestatsiya quiz (bitta, qo'lda)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Tungi vaqtda ham yuborish"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: quiz
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quiz yuborish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003982072134"
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python3 send.py
      - name: Hisoblagichni saqlash
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "quiz yuborildi"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
