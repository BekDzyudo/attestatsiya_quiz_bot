name: Attestatsiya quiz

on:
  schedule:
    # Toshkent vaqti 09:00–23:30, har 30 daqiqada (GitHub UTC bo'yicha ishlaydi: UTC+5)
    - cron: "0,30 4-18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Tungi vaqtda ham yuborish"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: quiz
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quiz yuborish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003982072134"
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python3 send.py
      - name: Hisoblagichni saqlash
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "quiz yuborildi" && git push)
