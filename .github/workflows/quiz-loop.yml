name: Attestatsiya quiz (uzluksiz)

# GitHub "schedule" ishonchsiz ishlagani uchun bitta job ~5,5 soat davomida
# o'zi har 10 daqiqada quiz yuboradi, oxirida o'zini qayta ishga tushiradi.
# Toshkent vaqti 09:00–23:59 oralig'ida yuboradi, tunda kutadi.
on:
  workflow_dispatch:
  schedule:
    # Zaxira: zanjir uzilib qolsa, kuniga bir necha marta qayta tiklanadi
    - cron: "17 3,9,15 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: quiz-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Har 5 daqiqada yuborish va buyruqlarga javob berish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003982072134"
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          python3 stats.py --setup || true
          end=$(( $(date +%s) + 330*60 ))
          # Repo bilan sinxronlash. stats/ papkasidagi maʼlumotlarni faqat shu job yozadi, shuning uchun
          # toʻqnashuvda ham ular hech qachon tashlab yuborilmaydi: nusxasi olinib, qayta tiklanadi.
          sync() {
            git pull -q --rebase --autostash 2>/dev/null && return 0
            git rebase --abort 2>/dev/null || true
            rm -rf /tmp/stats_bak && cp -r stats /tmp/stats_bak
            git fetch -q origin main && git reset -q --hard origin/main
            cp -r /tmp/stats_bak/. stats/
            echo "sinxronlashda toʻqnashuv: origin/main olindi, statistika saqlab qolindi"
          }
          save() {
            git add state.json stats
            git diff --cached --quiet && return 0
            git commit -q -m "$1"
            for i in 1 2 3 4 5 6; do sync && git add stats && { git diff --cached --quiet || git commit -q -m "$1"; } && git push -q && return 0; sleep 10; done
            echo "push muvaffaqiyatsiz"
          }
          while [ $(date +%s) -lt $end ]; do
            sync
            python3 send.py || echo "yuborishda xato"
            python3 stats.py > /dev/null || echo "statistikada xato"
            save "quiz yuborildi"
            # keyingi 10 daqiqalik nuqtagacha javoblarni yigʻadi va /stat, /men ga javob beradi
            now=$(date +%s); wait=$(( 600 - now % 600 + 5 ))
            python3 stats.py --listen $wait || sleep $wait
            # tinglash davridagi javoblar darhol saqlanadi (job tugasa ham yoʻqolmaydi)
            save "javoblar saqlandi"
          done
      - name: Zanjirni davom ettirish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run quiz-loop.yml --ref main -R ${{ github.repository }}
