name: Attestatsiya quiz (uzluksiz)

# GitHub "schedule" ishonchsiz ishlagani uchun bitta job ~5,5 soat davomida
# o'zi har 10 daqiqada quiz yuboradi, oxirida o'zini qayta ishga tushiradi.
# Toshkent vaqti 09:00–23:59 oralig'ida yuboradi, tunda kutadi.
on:
  workflow_dispatch:
  schedule:
    # Zaxira: zanjir uzilib qolsa, kuniga bir necha marta qayta tiklanadi
    - cron: "17 3,9,15 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: quiz-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Har 5 daqiqada yuborish va buyruqlarga javob berish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003982072134"
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          python3 stats.py --setup || true
          end=$(( $(date +%s) + 330*60 ))
          # Repo bilan sinxronlash: tashqaridan (qo'lda) o'zgartirish bo'lsa va to'qnashuv chiqsa,
          # yarim qolgan rebase tufayli tsikl to'xtab qolmasligi uchun masofaviy holatga qaytariladi.
          sync() {
            git pull -q --rebase --autostash 2>/dev/null && return 0
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            echo "sinxronlashda to'qnashuv: origin/main holatiga qaytarildi"
          }
          while [ $(date +%s) -lt $end ]; do
            sync
            python3 send.py || echo "yuborishda xato"
            python3 stats.py > /dev/null || echo "statistikada xato"
            git add state.json stats
            if ! git diff --cached --quiet; then
              git commit -q -m "quiz yuborildi"
              for i in 1 2 3; do sync && git push -q && break; sleep 5; done
            fi
            # keyingi 10 daqiqalik nuqtagacha /stat, /men buyruqlarini kutib, darhol javob beradi
            now=$(date +%s); wait=$(( 600 - now % 600 + 5 ))
            python3 stats.py --listen $wait || sleep $wait
          done
      - name: Zanjirni davom ettirish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run quiz-loop.yml --ref main -R ${{ github.repository }}
