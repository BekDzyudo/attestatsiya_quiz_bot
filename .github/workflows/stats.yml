name: Quiz statistikasi (qo'lda)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Javoblarni yig'ish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python3 stats.py
      - name: Saqlash
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add stats
          git diff --cached --quiet && exit 0
          git commit -q -m "statistika yangilandi"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
